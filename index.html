<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>NFL Line Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--paper:#EDEFEA;--surface:#FFF;--ink:#111A16;--ink-2:#3B4A43;--muted:#66766E;
  --line:#D3DAD3;--brass:#8F6B18;--hot:#AE3A1E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0D1411;--surface:#151E1A;--ink:#E7EDE9;
  --ink-2:#B6C4BC;--muted:#7F9188;--line:#26332D;--brass:#D9AD4E;--hot:#E8815F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
  padding:30px 30px 26px;box-shadow:0 1px 2px rgba(17,26,22,.06),0 10px 30px -20px rgba(17,26,22,.5)}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted)}
.card h1{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;
  font-size:34px;line-height:.96;margin:6px 0 0;letter-spacing:-.005em}
.card h1 span{color:var(--brass)}
.card p{font-size:13px;color:var(--muted);margin:14px 0 18px;line-height:1.5}
label{display:block;font-family:"Barlow Condensed",sans-serif;font-size:12.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);border-radius:2px}
input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
button{margin-top:12px;width:100%;font-family:"Barlow Condensed",sans-serif;font-size:16px;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:10px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);cursor:pointer;border-radius:2px}
button:hover{background:var(--ink-2);border-color:var(--ink-2)}
button[disabled]{opacity:.6;cursor:default}
.err{margin-top:12px;font-size:13px;color:var(--hot);min-height:19px}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div id="gate">
  <form class="card" id="f" autocomplete="off">
    <div class="eyebrow">All 32 teams</div>
    <h1>NFL<br>Line <span>Board</span></h1>
    <p>This board is private. Enter the password to unlock it.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">Unlock</button>
    <div class="err" id="err" role="status" aria-live="polite"></div>
    <div class="foot">Analysis, not advice. Bet what you can afford to lose.</div>
  </form>
</div>
<div id="app"></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const errEl = document.getElementById('err');

async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(BLOB.salt), iterations:BLOB.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(BLOB.iv)}, key, b64(BLOB.ct));
  return new TextDecoder().decode(plain);
}

function mount(html){
  document.getElementById('gate').remove();
  const app = document.getElementById('app');
  app.innerHTML = html;
  /* innerHTML does not run scripts - re-create them so the board boots */
  app.querySelectorAll('script').forEach(old => {
    const s = document.createElement('script');
    for (const a of old.attributes) s.setAttribute(a.name, a.value);
    s.textContent = old.textContent;
    old.replaceWith(s);
  });
}

async function attempt(pw, remember){
  const html = await decrypt(pw);
  if (remember) { try { sessionStorage.setItem('nflb', pw); } catch (e) {} }
  mount(html);
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go');
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  btn.disabled = true; btn.textContent = 'Unlocking'; errEl.textContent = '';
  try {
    await attempt(pw, true);
  } catch (err) {
    errEl.textContent = 'That password did not work.';
    btn.disabled = false; btn.textContent = 'Unlock';
    document.getElementById('pw').select();
  }
});

/* already unlocked in this tab? go straight in */
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem('nflb'); } catch (e) {}
  if (!saved) return;
  try { await attempt(saved, false); }
  catch (e) { try { sessionStorage.removeItem('nflb'); } catch (e2) {} }
})();
</script>
